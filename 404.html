<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Jose M Vera</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages (MIT)
    // GitHub Pages has no server-side rewrite, so a deep link like /about is served
    // this 404 page. Encode the requested path into a query string and bounce to the
    // app root; the decoder in index.html restores the real URL before React mounts.
    var pathSegmentsToKeep = 0; // site is served from the domain root
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>

<body></body>

</html>
